name: CI

on:
  pull_request:
  # El despliegue la llama para volver a probar el commit fusionado en main.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci

      - name: Lint y tipos de la app
        run: |
          npm run lint -w portal
          npm run format:check -w portal
          npm run build -w portal

      - name: Lint, formato y tipos de las funciones
        run: |
          deno check --no-lock --config supabase/functions/verify-access/deno.json supabase/functions/verify-access/index.ts
          deno check --no-lock --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts
          deno lint --config supabase/functions/deno.json supabase/functions
          deno fmt --check --config supabase/functions/deno.json supabase/functions

      # Mailpit se queda: el registro envía el correo de confirmación y las pruebas E2E lo leen.
      - name: Levantar Supabase local
        run: |
          npx supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,supavisor,postgres-meta
          npx supabase status -o env > supabase/.env.test

      - name: Pruebas de base de datos
        run: npx supabase test db

      - name: Pruebas de funciones
        run: deno test --config supabase/functions/deno.json --allow-net --allow-env --env-file=supabase/.env.test supabase/functions/tests/

      - name: Pruebas end-to-end
        working-directory: e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
