name: Despliegue

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Vuelve a probar el commit fusionado: si CI falla, no se despliega nada.
  ci:
    uses: ./.github/workflows/ci.yml

  development:
    needs: ci
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: development
    secrets: inherit

  production:
    needs: development
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
    secrets: inherit
