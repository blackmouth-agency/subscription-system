name: Desplegar en un entorno

on:
  workflow_call:
    inputs:
      environment:
        description: development o production
        required: true
        type: string
      ref:
        description: Commit a desplegar. Vacío usa el commit que disparó el workflow.
        required: false
        type: string
        default: ""
      migrate:
        description: Aplicar las migraciones antes de desplegar el código.
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Aplicar migraciones
        if: ${{ inputs.migrate }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase db push

      - name: Desplegar la función
        run: npx supabase functions deploy verify-access --project-ref "$SUPABASE_PROJECT_ID"

      - name: Construir y publicar la app
        working-directory: apps/conoce-mas
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          npx wrangler deploy --env "${{ inputs.environment }}"
